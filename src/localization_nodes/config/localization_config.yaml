### ekf_node config file ###
ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    # Frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # IMU input
    # Config: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    #
    # Wave Rover T=1001 continuous feedback only provides orientation (r, p, y).
    # Angular velocity (gx, gy, gz) and acceleration (ax, ay, az) are only
    # available from T=126 IMU queries which may not always respond.
    # When a field is missing, the publisher sets covariance[0] = -1.
    # The EKF silently drops messages where a fused field has covariance = -1.
    # Therefore we only fuse orientation here. If T=126 data becomes reliable,
    # re-enable vroll/vpitch/vyaw and ax/ay/az.
    imu0: /imu/data
    imu0_config:
      [
        false,
        false,
        false,
        true,
        true,
        true,
        false,
        false,
        false,
        false,
        false,
        false,
        false,
        false,
        false,
      ]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false

    # Visual Odometry input from RTAB-Map
    # Provides position and orientation from visual SLAM.
    # Uses high covariance since monocular depth is approximate.
    # Requires slam_launch.py to be running (publishes /rtabmap/odom).
    odom0: /rtabmap/odom
    odom0_config:
      [
        true,
        true,
        false,
        false,
        false,
        true,
        false,
        false,
        false,
        false,
        false,
        false,
        false,
        false,
        false,
      ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # Process noise covariance
    process_noise_covariance:
