[pytest]
# Pytest configuration for perception_nodes tests only
# This file overrides the workspace-level pytest.ini

testpaths = test
pythonpath = .
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Disable ROS launch testing plugins that conflict with regular unit tests
addopts = -v --tb=short --color=yes -p no:launch_testing -p no:launch_testing_ros

minversion = 6.0
timeout = 300
