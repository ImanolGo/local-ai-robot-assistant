[project]
name = "local-ai-robot-assistant"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "transformers",
    "pyaudio",
    "pyserial",
    "pyds",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["test*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout",
    "pytest-cov",
    "pytest-mock",
    "black",
    "flake8",
    "isort",
    "mypy",
    "ruff",
    "pre-commit"
]
test = [
    "pytest>=7.0",
    "pytest-timeout",
    "pytest-cov",
    "pytest-mock",
    "unittest-xml-reporting"
]
