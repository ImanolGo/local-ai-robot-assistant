[tool.pytest.ini_options]
# Pytest configuration for Local AI Robot Assistant
# Supports reorganized test structure with proper test discovery

# Test discovery paths
testpaths = [
    "integration_tests",    # Integration tests (multi-node, system-level)
    "hardware_tests",       # Hardware validation tests
    "manual_tests",        # Manual testing scripts
    "src/*/test",          # Unit tests within packages (colcon discovers these)
]

# Test file patterns
python_files = [
    "test_*.py",
    "*_test.py"
]

# Test function patterns
python_functions = [
    "test_*"
]

# Test class patterns
python_classes = [
    "Test*",
    "*Test",
    "*Tests"
]

# Markers for test categorization
markers = [
    "unit: Unit tests (single node, mocked dependencies)",
    "integration: Integration tests (multi-node, no hardware)",
    "hardware: Hardware tests (require physical devices)",
    "slow: Tests that take more than 5 seconds",
    "network: Tests requiring network connectivity",
    "gpu: Tests requiring GPU/CUDA",
    "audio: Tests requiring audio hardware",
    "camera: Tests requiring camera hardware",
    "uart: Tests requiring UART/serial hardware",
    "manual: Manual tests requiring human interaction"
]

# Test output configuration
addopts = [
    "-v",                   # Verbose output
    "--tb=short",          # Short traceback format
    "--strict-markers",    # Require all markers to be defined
    "--strict-config",     # Strict configuration checking
    "--color=yes",         # Colored output
    # "--cov=src",         # Enable when coverage is needed
    # "--cov-report=html", # HTML coverage report
]

# Minimum version
minversion = "7.0"

# Test timeouts (requires pytest-timeout)
timeout = 300              # 5 minutes default timeout
timeout_method = "thread"

# Logging configuration
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Warnings configuration
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:gi.repository",
    "ignore::UserWarning:rclpy",
]

# Custom test collection behavior
collect_ignore = [
    "src/build/",
    "src/install/",
    "src/log/",
    "build/",
    "install/",
    "log/",
    ".venv/",
    "venv/",
]
