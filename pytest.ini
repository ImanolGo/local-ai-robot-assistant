[pytest]
# Pytest configuration for Local AI Robot Assistant

testpaths = integration_tests hardware_tests manual_tests
pythonpath = src
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test* *Test *Tests

markers =
    unit: Unit tests (single node, mocked dependencies)
    integration: Integration tests (multi-node, no hardware)
    hardware: Hardware tests (require physical devices)
    slow: Tests that take more than 5 seconds
    uart: Tests requiring UART/serial hardware

addopts = -v --tb=short --strict-markers --color=yes -p no:launch_testing -p no:launch_testing_ros
minversion = 6.0
timeout = 300

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
