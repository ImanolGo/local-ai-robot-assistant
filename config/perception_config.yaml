# Perception Configuration for Local AI Robot Assistant
# TensorRT-optimized AI models for NVIDIA Jetson Orin Nano

# Object Detection (YOLOv11n)
object_detection:
  yolo:
    model: "yolo11n"
    engine_path: "models/yolo_trt/yolo11n_fp16.engine"
    input_size: [640, 640]
    conf_threshold: 0.25
    iou_threshold: 0.45
    max_detections: 100

  # Inference settings
  inference:
    confidence_threshold: 0.5
    nms_threshold: 0.4
    max_detections: 100
    batch_size: 1

  # Performance settings
  tensorrt:
    precision: "FP16"
    max_workspace_size: 1073741824 # 1GB
    use_dla: false
    dla_core: 0

  # Class configuration
  classes:
    enabled_classes: "all" # or list of specific class IDs
    class_names_file: "/models/coco_classes.txt"

# Depth Estimation (FastDepth)
depth_estimation:
  model:
    name: "depth-anything-v2"
    type: "tensorrt"
    engine_path: "models/depth_trt/depth_anything_v2_vits.engine"
    onnx_path: "models/depth_trt/depth_anything_v2_vits.onnx"
    input_shape: [1, 3, 518, 518]

  # Inference settings
  inference:
    depth_range: [0.1, 10.0] # meters
    batch_size: 1

  # Performance settings
  tensorrt:
    precision: "FP16"
    max_workspace_size: 536870912 # 512MB
    use_dla: false

  # Output configuration
  output:
    colormap: "plasma"
    normalize: true

# Point Cloud Generation
point_cloud:
  enabled: true

  # Generation settings
  generation:
    max_depth: 5.0 # meters
    min_depth: 0.1 # meters
    skip_pixels: 1 # Subsample for performance

  # Filtering
  filtering:
    remove_outliers: true
    statistical_filter: true
    radius_filter: false

# Processing Pipeline
pipeline:
  # Input preprocessing
  preprocessing:
    resize_method: "bilinear"
    normalization: "imagenet" # ImageNet mean/std

  # Memory management
  memory:
    gpu_memory_fraction: 0.3 # 30% of GPU memory for perception
    use_unified_memory: true

  # Synchronization
  sync:
    max_age_diff: 0.1 # seconds
    queue_size: 2

# ROS2 topic configuration
topics:
  # Subscribers
  input_image: "/camera/undistorted"

  # Publishers - Object Detection
  object_detections: "/perception/objects"
  detection_image: "/perception/detection_viz"

  # Publishers - Depth
  depth_map: "/perception/depth"
  depth_image: "/perception/depth_viz"

  # Publishers - Point Cloud
  point_cloud: "/perception/pointcloud"

  # Diagnostics
  performance_metrics: "/perception/performance"

# Node configuration
nodes:
  object_detector:
    node_name: "object_detector"
    namespace: ""
    use_sim_time: false

  depth_estimator:
    node_name: "depth_estimator"
    namespace: ""
    use_sim_time: false

  point_cloud_generator:
    node_name: "point_cloud_generator"
    namespace: ""
    use_sim_time: false

# Performance targets
performance_targets:
  object_detection_fps: 15
  depth_estimation_fps: 15
  combined_pipeline_fps: 10
  max_latency_ms: 100

# Model management
model_management:
  # Model optimization
  optimization:
    auto_tune: true
    calibration_dataset_size: 100

  # Model loading
  loading:
    lazy_loading: true
    preload_on_startup: false
    memory_mapped: true

  # Model validation
  validation:
    verify_engines: true
    benchmark_on_load: true

# Error handling
error_handling:
  max_inference_failures: 5
  failure_recovery_delay: 1.0 # seconds
  fallback_mode: "skip_frame"

# Logging and monitoring
logging:
  log_level: "INFO"
  log_inference_times: true
  log_memory_usage: false # Debug mode only
  performance_monitoring: true

# Hardware-specific settings
hardware:
  jetson_model: "orin_nano"
  gpu_memory_gb: 8
  max_power_mode: "MAXN"

# Notes
notes:
  - "TensorRT engines must be built on target hardware"
  - "FP16 precision provides good balance of speed and accuracy"
  - "Memory management is critical on 8GB Jetson Orin Nano"
  - "Point cloud generation is computationally expensive"
  - "Consider disabling point cloud for real-time applications"
