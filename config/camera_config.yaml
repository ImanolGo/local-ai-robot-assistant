# Camera Configuration for IMX219 Camera with DeepStream Pipeline
# Optimized for NVIDIA Jetson Orin Nano with JetPack SDK

# Camera Hardware Settings
camera:
  device_id: 0
  sensor_mode: 0  # IMX219 sensor mode (affects resolution and FOV)
  width: 1640
  height: 1232
  framerate: 30
  flip_method: 0  # 0=none, 1=counter-clockwise, 2=rotate-180, 3=clockwise

# DeepStream Pipeline Configuration
deepstream:
  # GStreamer source element for CSI camera
  source_element: "nvarguscamerasrc"

  # NVMM memory management for zero-copy operations
  nvmm_memory: true
  memory_type: "nvmm"

  # GPU acceleration settings
  gpu_id: 0
  cuda_memory_type: "device"

  # Buffer configuration for low latency
  buffer_pool_size: 4
  max_buffers: 8
  drop_frame_interval: 0

  # Video format and encoding
  format: "NV12"  # Native format for hardware acceleration

  # Performance optimization
  do_timestamp: true

# ROS2 Node Configuration
ros2:
  # Topic names
  raw_image_topic: "/camera/raw"
  camera_info_topic: "/camera/camera_info"
  undistorted_image_topic: "/camera/undistorted"

  # QoS settings for real-time performance
  qos_profile:
    reliability: "best_effort"
    durability: "volatile"
    history: "keep_last"
    depth: 1

  # Node parameters
  publish_camera_info: true
  frame_id: "camera_link"

# Calibration file path
calibration_file: "/home/imanolgo/repos/local-ai-robot-assistant/config/camera_calibration.yaml"

# Performance Monitoring
monitoring:
  enable_fps_monitoring: true
  enable_gpu_monitoring: true
  log_performance_stats: true
  stats_publish_rate: 1.0  # Hz

# Debug and Development
debug:
  enable_debug_output: false
  save_debug_images: false
  debug_image_path: "/tmp/camera_debug/"

# Hardware-specific settings for IMX219
imx219_settings:
  # Auto exposure and gain
  auto_exposure: 1
  exposure_time_range: [13000, 683709000]  # nanoseconds
  gain_range: [1.0, 10.625]

  # Auto white balance
  auto_white_balance: 1
  white_balance_gains: [1.0, 1.0, 1.0, 1.0]  # R, Gr, Gb, B

  # Saturation and other image enhancements
  saturation: 1.0

# Undistortion Configuration
undistortion:
  # GPU acceleration for undistortion
  use_gpu_acceleration: true
  interpolation_method: "linear"  # linear, cubic, lanczos4
  border_mode: "constant"  # constant, reflect, wrap, reflect_101
  border_value: [0, 0, 0]  # BGR values for constant border

  # Performance optimization
  cache_maps: true
  use_optimized_camera_matrix: true
  alpha: 1.0  # Free scaling parameter (0=crop valid pixels, 1=retain all pixels)
