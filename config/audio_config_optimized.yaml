audio:
  buffer_size: 2048
  chunk_size: 800
  sample_rate: 16000
wake_word:
  enable_speex_noise_suppression: true
  inference_framework: onnx
  model_path: /home/imanolgo/repos/local-ai-robot-assistant/models/wake_word/hey_roe_ver.onnx
  prediction_frequency: 0.05
  vad_threshold: 0.5
whisper:
  append_punctuations: '"''.,,!!??::)]}'
  beam_size: 1
  best_of: 1
  compression_ratio_threshold: 2.4
  compute_type: int8
  condition_on_previous_text: false
  cpu_threads: 2
  device: cpu
  initial_prompt: null
  length_penalty: 1.0
  log_prob_threshold: -1.0
  model_size: tiny
  no_speech_threshold: 0.6
  num_workers: 1
  patience: 1.0
  prepend_punctuations: '"''([{-'
  repetition_penalty: 1.0
  word_timestamps: false
