# Model Registry for Local AI Robot Assistant
# This file contains metadata for all AI models used in the system

version: "1.2"
updated: "2025-11-10"
description: "Registry of AI models with metadata, sources, and requirements. Updated to use Depth Anything V2 Small and YOLO11n."

models:
  vision:
    yolo:
      name: "YOLO11n Object Detection"
      type: "object_detection"
      framework: "pytorch"
      runtime: "tensorrt"
      size_mb: 5.6
      input_resolution: [640, 480]
      output_classes: 80  # COCO classes
      performance_targets:
        fps: 20
        latency_ms: 50
        accuracy_map: 0.37
      memory_usage:
        ram_mb: 200
        vram_mb: 400
      source:
        provider: "Ultralytics"
        url: "https://huggingface.co/Ultralytics/YOLO11/resolve/main/yolo11n.pt"
        license: "AGPL-3.0"
        commercial_use: false  # GPL requires open source derivatives
      files:
        pytorch: "yolo11n.pt"
        tensorrt: "yolo11n_fp16.engine"
        config: "yolo_config.yaml"
      conversion:
        required: true
        script: "tools/convert_yolo.py"
        precision: "fp16"

    depth_anything_v2:
      name: "Depth Anything V2 Small Monocular Depth Estimation"
      type: "depth_estimation"
      framework: "transformers"
      runtime: "tensorrt"
      size_mb: 95.0
      input_resolution: [518, 518]
      output_format: "depth_map"
      performance_targets:
        fps: 20
        latency_ms: 50
      memory_usage:
        ram_mb: 250
        vram_mb: 400
      source:
        provider: "Depth-Anything"
        url: "https://huggingface.co/depth-anything/Depth-Anything-V2-Small-hf"
        license: "Apache-2.0"
        commercial_use: true
      files:
        transformers_config: "config.json"
        transformers_model: "model.safetensors"
        preprocessor_config: "preprocessor_config.json"
        onnx: "depth_anything_v2_small.onnx"
        tensorrt: "depth_anything_v2_small.trt"
        model_config: "depth_trt/config.json"
      conversion:
        required: true
        script: "tools/conversion/convert_depth.py"
        precision: "fp16"
        workspace_mb: 4096
      features:
        - "DPT architecture with DINOv2 backbone"
        - "Trained on 595K synthetic + 62M+ real images"
        - "Superior fine-grained details vs V1"
        - "10x faster than diffusion-based models"
        - "State-of-the-art robustness and accuracy"
        - "Optimized for Jetson Orin Nano deployment"
      ros2_integration:
        node: "src/perception_nodes/perception_nodes/depth_estimation_node.py"
        topics:
          subscriptions:
            - "/camera/image_undistorted"
            - "/camera/camera_info"
          publications:
            - "/perception/depth"
            - "/perception/depth_colored"
            - "/perception/depth_stats"
            - "/perception/obstacles"

  audio:
    whisper:
      name: "Whisper Tiny Speech Recognition"
      type: "speech_to_text"
      framework: "transformers"
      runtime: "faster_whisper"
      size_mb: 144.1
      source:
        provider: "OpenAI"
        url: "https://github.com/openai/whisper"
        license: "MIT"
        commercial_use: true
      files:
        pytorch: "whisper_tiny.bin"
        config: "config.json"
        tokenizer: "tokenizer.json"

    piper:
      name: "Piper Text-to-Speech"
      type: "text_to_speech"
      framework: "onnx"
      runtime: "onnx"
      size_mb: 60.3
      voice_model: "en_US-lessac-medium"
      performance_targets:
        latency_ms: 500
        words_per_second: 30
      memory_usage:
        ram_mb: 150
      actual_performance:
        latency_ms: 236  # 5 words in 236ms
        words_per_second: 33.6  # 0.030s per word
      source:
        provider: "Rhasspy"
        url: "https://github.com/rhasspy/piper"
        license: "MIT"
        commercial_use: true
      files:
        onnx: "en_US-lessac-medium.onnx"
        config: "en_US-lessac-medium.onnx.json"
      implementation:
        ros2_node: "src/audio_interface_nodes/piper_tts_node.py"
        test_script: "scripts/test_piper_tts.py"
        ros2_test: "scripts/test_piper_ros2.py"

    wake_word:
      name: "openWakeWord Models"
      type: "wake_word_detection"
      framework: "onnx"
      runtime: "onnx"
      size_mb: 1.2
      source:
        provider: "openWakeWord"
        url: "https://github.com/dscripka/openWakeWord"
        license: "Apache-2.0"
        commercial_use: true
      files:
        onnx: "hey_roe_ver.onnx"

  language:
    nanollm:
      name: "NanoLLM Base Model"
      type: "large_language_model"
      framework: "transformers"
      runtime: "nanollm"
      size_mb: 0.1
      description: "Microsoft Phi-3 Mini (4K) instruction-tuned base model (info only)"
      source:
        provider: "Microsoft"
        url: "https://huggingface.co/microsoft/Phi-3-mini-4k-instruct"
        license: "MIT"
        commercial_use: true
      files:
        readme: "phi3_readme.md"
      conversion:
        required: true
        script: "tools/quantize_llm.py"
        note: "Use NanoLLM tools to download and quantize full model"

    phi3:
      name: "Microsoft Phi-3 Mini 4K Instruct"
      type: "large_language_model"
      framework: "transformers"
      runtime: "nanollm"
      size_mb: 7800  # Original size
      quantized_size_mb: 2500  # INT4 quantized
      parameters: "3.8B"
      context_length: 4096
      performance_targets:
        tokens_per_second: 15
        latency_ms: 2000  # for typical response
        memory_efficiency: "high"
      memory_usage:
        ram_mb: 2500  # When loaded
        vram_mb: 0
      source:
        provider: "Microsoft"
        url: "https://huggingface.co/microsoft/Phi-3-mini-4k-instruct"
        license: "MIT"
        commercial_use: true
      files:
        original: "pytorch_model.bin"
        quantized: "phi3_int4.bin"
        config: "config.json"
        tokenizer: "tokenizer.json"
      conversion:
        required: true
        script: "tools/quantize_llm.py"
        precision: "int4"
        method: "awq"

    llama2:
      name: "Meta LLaMA 2 7B Chat"
      type: "large_language_model"
      framework: "transformers"
      runtime: "nanollm"
      size_mb: 13000  # Original size
      quantized_size_mb: 3500  # INT4 quantized
      parameters: "7B"
      context_length: 4096
      performance_targets:
        tokens_per_second: 12
        latency_ms: 2500
        memory_efficiency: "medium"
      memory_usage:
        ram_mb: 3500  # When loaded
        vram_mb: 0
      source:
        provider: "Meta AI"
        url: "https://huggingface.co/meta-llama/Llama-2-7b-chat-hf"
        license: "LLaMA-2-Custom"
        commercial_use: true  # With restrictions (<700M MAU)
      files:
        original: "pytorch_model.bin"
        quantized: "llama2_int4.bin"
        config: "config.json"
        tokenizer: "tokenizer.json"
      conversion:
        required: true
        script: "tools/quantize_llm.py"
        precision: "int4"
        method: "awq"

    gemma2:
      name: "Google Gemma 2-7B Instruct"
      type: "large_language_model"
      framework: "transformers"
      runtime: "nanollm"
      size_mb: 14000  # Original size
      quantized_size_mb: 3800  # INT4 quantized
      parameters: "7B"
      context_length: 8192
      performance_targets:
        tokens_per_second: 10
        latency_ms: 3000
        memory_efficiency: "medium"
      memory_usage:
        ram_mb: 3800  # When loaded
        vram_mb: 0
      source:
        provider: "Google DeepMind"
        url: "https://huggingface.co/google/gemma-2-7b-it"
        license: "Gemma-Custom"
        commercial_use: true  # With terms
      files:
        original: "pytorch_model.bin"
        quantized: "gemma2_int4.bin"
        config: "config.json"
        tokenizer: "tokenizer.json"
      conversion:
        required: true
        script: "tools/quantize_llm.py"
        precision: "int4"
        method: "awq"

# Model deployment configurations
deployment:
  memory_management:
    total_budget_mb: 7500  # Jetson Orin Nano 8GB - 512MB system reserve
    warning_threshold: 0.80
    critical_threshold: 0.90

  lazy_loading:
    enabled: true
    unload_timeout_minutes: 5
    priority_order:
      - wake_word    # Always loaded
      - camera       # Keep for safety
      - motor_control # Keep for safety
      - vision_models # Unload when LLM needed
      - audio_models  # Unload when LLM needed
      - llm          # Load on demand

  performance_monitoring:
    fps_monitoring: true
    memory_monitoring: true
    temperature_monitoring: true
    error_logging: true

# Hardware-specific optimizations
hardware:
  jetson_orin_nano:
    tensorrt_version: "8.6"
    cuda_version: "11.4"
    max_batch_size: 1
    dla_cores: 0  # Orin Nano has no DLA
    gpu_memory_fraction: 0.8

  optimizations:
    vision:
      use_zero_copy: true
      use_nvmm_memory: true
      pipeline_depth: 2

    audio:
      buffer_size_ms: 100
      sample_rate: 16000
      channels: 1

    llm:
      kv_cache_optimization: true
      attention_optimization: true
      memory_mapping: true

# Quality thresholds
quality_targets:
  vision:
    object_detection_confidence: 0.5
    depth_estimation_range: [0.5, 10.0]  # meters

  audio:
    wake_word_confidence: 0.5
    speech_recognition_confidence: 0.3
    tts_quality_minimum: 3.5  # MOS scale

  language:
    response_relevance: 0.8
    intent_extraction_confidence: 0.7
    safety_filter_threshold: 0.9

# Update information
maintenance:
  last_updated: "2025-11-07"
  update_frequency: "monthly"
  version_tracking: true
  deprecation_warnings: true

dependencies:
  system:
    - "python>=3.10"
    - "cuda>=11.4"
    - "tensorrt>=8.6"
    - "opencv>=4.5"
    - "gdown>=5.0"  # Required for various model downloads

  python_packages:
    - "torch>=2.0"
    - "transformers>=4.30"
    - "onnxruntime-gpu>=1.15"
    - "ultralytics>=8.0"
    - "faster-whisper>=0.9"
    - "pyaudio>=0.2.11"
